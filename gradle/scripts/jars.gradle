def currentJvm = System.getProperty("java.version")
println "Current Java version = " + currentJvm

ext.sharedManifest = manifest {
    attributes("Built-By": System.getProperty('user.name'),
               "Created-By": currentJvm,
               "Implementation-Title": archivesBaseName,
               "Implementation-Version": project.version
    )
}

task deobfJar(type: Jar) {
     from sourceSets.main.output
     //if project name is BBM-Dev it makes the deobf jar deobf-dev if not its just deobf
     if (project.hasProperty("bambooshortPlanName") && project.getProperty("bambooshortPlanName") == "BBM-Dev") archiveClassifier.set("deobf-dev")
     else archiveClassifier.set("deobf")
     //sets where the jars go to.
     destinationDirectory.set(file('output'))
     manifest = project.manifest {
        from sharedManifest
    }
     mustRunAfter "jar" 
}

jar {
     //if project has the property BBM-Dev then it appends dev to indicate the dev branch
     if (project.hasProperty("bambooshortPlanName") && project.getProperty("bambooshortPlanName") == "BBM-Dev") archiveClassifier.set("dev-universal")
     else archiveClassifier.set("universal")
     //sets where the jars go to.
     destinationDirectory.set(file('output'))
     manifest = project.manifest {
        from sharedManifest
     
     }
}

tasks.build.dependsOn deobfJar
